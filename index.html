<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbeitszeiterfassung</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbeitszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7380;--bd:#e1e4e8;--ac:#2563eb;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ae;--bd:#2d333b;--ac:#5b8def;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ae;--bd:#2d333b;--ac:#5b8def;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,input{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.bad{background:transparent;color:var(--bad);padding:4px 10px;font-size:1.2rem;font-weight:700;line-height:1}
.x{position:sticky;right:0;background:var(--card);text-align:right}
input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu);gap:3px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;text-align:center}
.big{font-size:1.5rem;font-weight:600}
.mu{color:var(--mu);font-size:.85rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:.8rem;color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const KEY='az-data';
let D={name:'',rate:15,fpRate:12.5,entries:[],payouts:[]};
try{const r=localStorage.getItem(KEY);if(r)D=Object.assign(D,JSON.parse(r));}catch(e){}
let pend=null,fpOn=false,tab=1,month=new Date().toISOString().slice(0,7),msg='',imp=[],open=null,dl=null;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){msg='Speichern im Browser nicht möglich.';}};
const tm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b;};
const wd=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'long'});
const fd=d=>d.split('-').reverse().join('.');
const fh=h=>{const neg=h<0,m=Math.round(Math.abs(h)*60);return(neg?'−':'')+Math.floor(m/60)+':'+p2(m%60)+' h';};
const work=e=>Math.max(0,tm(e.e)-tm(e.b)-(e.p||0)+0)/60;
const fe=v=>v.toFixed(2).replace('.',',')+' €';
const pay=e=>work(e)*D.rate+(e.fp?D.fpRate:0);
const sumPay=()=>D.entries.reduce((a,e)=>a+pay(e),0);
const sumW=()=>D.entries.reduce((a,e)=>a+work(e),0);
const sumP=()=>D.payouts.reduce((a,p)=>a+p.h,0);

function addEntry(){
  const nmf=$('#nm');if(nmf){D.name=nmf.value.trim();persist();}
  if(!D.name){msg='Bitte zuerst den Namen des Mitarbeiters eingeben.';return render();}
  const d=$('#d').value,b=$('#b').value,e=$('#e').value;
  if(!d||!b||!e||tm(e)<=tm(b)){msg='Bitte Datum, Beginn und Ende angeben (Ende nach Beginn).';return render();}
  D.entries.push({id:String(Date.now()),d,ort:$('#o').value.trim(),tat:$('#t').value.trim(),b,e,p:+$('#p').value||0,fp:fpOn});
  fpOn=false;msg='';persist();render();
}
function addPayout(){
  const h=parseFloat(String($('#ph').value).replace(',','.'))||0,f=parseInt($('#pf').value)||0,d=$('#pd').value;
  if(!(h>0||f>0)||!d){msg='Bitte Datum sowie Stunden und/oder Fahrpauschalen für die Auszahlung angeben.';return render();}
  D.payouts.push({id:String(Date.now()),d,h,fp:f,n:$('#pn').value.trim()});msg='';persist();render();
}
async function saveFile(o){
  const blob=new Blob([o.data],{type:'text/csv;charset=utf-8'});
  try{const f=new File([blob],o.filename,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e&&e.name=='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
async function exportCsv(){
  const nmf=$('#nm');if(nmf){D.name=nmf.value.trim();persist();}
  if(!D.name){msg='Bitte zuerst den Namen des Mitarbeiters eingeben.';return render();}
  const L=[['Mitarbeiter','Typ','Datum','Wochentag','Ort','Tätigkeit','Beginn','Ende','Pause (min)','Fahrpauschale','Arbeitszeit (h)','Verdienst (€)','Stundenlohn (€)','Fahrpauschale (€)'].join(';')];
  const n=x=>x.toFixed(2).replace('.',',');
  D.entries.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(e=>L.push([q(D.name),'Arbeit',e.d,wd(e.d),q(e.ort),q(e.tat),e.b,e.e,e.p,e.fp?'Ja':'',n(work(e)),n(pay(e)),n(D.rate),n(D.fpRate)].join(';')));
  D.payouts.forEach(p=>L.push([q(D.name),'Auszahlung',p.d,wd(p.d),'',q(p.n),'','','',p.fp?'-'+p.fp:'',n(-p.h),'',n(D.rate),n(D.fpRate)].join(';')));
  try{await saveFile({filename:'arbeitszeiten'+(D.name?'-'+D.name.replace(/\W+/g,'_'):'')+'.csv',data:'\ufeff'+L.join('\n')});}catch(e){msg='Export nicht möglich.';render();}
}
function parseCsv(t){const R=[];let r=[],c='',iq=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(iq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++;}else iq=false;}else c+=ch;}
    else if(ch=='"')iq=true;else if(ch==';'){r.push(c);c='';}
    else if(ch=='\n'){r.push(c.replace(/\r$/,''));R.push(r);r=[];c='';}else c+=ch;}
  if(c||r.length){r.push(c);R.push(r);}return R.slice(1).filter(x=>x.length>=11);}
async function importFiles(files){
  for(const f of files){const rows=parseCsv(await f.text());
    rows.forEach(x=>imp.push({ma:x[0]||f.name.replace(/\.csv$/i,''),typ:x[1],d:x[2],wd:x[3],ort:x[4],tat:x[5],b:x[6],e:x[7],pa:x[8],fp:x[9]=='Ja',fpn:x[1]=='Auszahlung'?Math.abs(parseInt(x[9]))||0:0,rt:parseFloat(String(x[12]||'').replace(',','.'))||0,fr:parseFloat(String(x[13]||'').replace(',','.'))||0,h:parseFloat(String(x[10]).replace(',','.'))||0,v:parseFloat(String(x[11]||'').replace(',','.'))||0}));}
  render();
}
function chef(){
  const g={};imp.forEach(r=>(g[r.ma]=g[r.ma]||[]).push(r));
  const names=Object.keys(g).sort();
  const body=names.map(n=>{const L=g[n],w=L.filter(r=>r.typ=='Arbeit').reduce((a,r)=>a+r.h,0),p=-L.filter(r=>r.typ=='Auszahlung').reduce((a,r)=>a+r.h,0),v=L.filter(r=>r.typ=='Arbeit').reduce((a,r)=>a+r.v,0),fpT=L.filter(r=>r.fp).length,fpP=L.reduce((a,r)=>a+r.fpn,0),rt=(L.find(r=>r.rt)||{}).rt||0,fr=(L.find(r=>r.fr)||{}).fr||0,off=(w-p)*rt+(fpT-fpP)*fr;
    let s=`<tr><td>${esc(n)}</td><td>${fh(w)}</td><td>${fh(p)}</td><td>${fh(w-p)}</td><td>${fpT-fpP}</td><td>${fe(v)}</td><td><b>${fe(off)}</b></td></tr>`;
    return s;}).join('')||'<tr><td colspan="7" class="mu">Noch keine CSV-Dateien geladen.</td></tr>';
  const all=imp.slice().sort((a,b)=>b.d.localeCompare(a.d)||a.ma.localeCompare(b.ma)).map(r=>`<tr><td>${esc(r.ma)}</td><td>${fd(r.d)}</td><td>${esc(r.wd)}</td><td>${esc(r.ort)}</td><td>${esc(r.tat)}</td><td>${r.typ=='Arbeit'?esc(r.b)+'–'+esc(r.e):'Auszahlung'}</td><td>${r.typ=='Arbeit'?esc(r.pa||0):''}</td><td>${r.typ=='Arbeit'?(r.fp?'✓':''):(r.fpn?'−'+r.fpn:'')}</td><td>${fh(r.h)}</td><td>${r.typ=='Arbeit'?fe(r.v):''}</td></tr>`).join('');
  return `<div class="card"><b>Alle Mitarbeiter</b><p class="mu">Die Daten bleiben auf dem Gerät des jeweiligen Mitarbeiters. Der Chef lädt hier die CSV-Dateien der Mitarbeiter, um alle Zeiten zu sehen. Die geladenen Dateien werden nicht gespeichert.</p>
    <div class="row"><input id="imp" type="file" accept=".csv" multiple><button class="sec" id="clr">Leeren</button></div></div>
    <div class="card scroll"><table><tr><th>Mitarbeiter</th><th>Gearbeitet</th><th>Ausbezahlt</th><th>Verbleibend</th><th>Fahrpausch. offen</th><th>Verdienst</th><th>Offener Betrag</th></tr>${body}</table></div>
    <div class="card"><b>Alle Einträge (${imp.length})</b><div class="scroll">${imp.length?`<table><tr><th>Mitarbeiter</th><th>Datum</th><th>Tag</th><th>Ort</th><th>Tätigkeit</th><th>Zeit</th><th>Pause</th><th>Fahrpausch.</th><th>Stunden</th><th>Verdienst</th></tr>${all}</table>`:'<p class="mu">Noch keine Einträge geladen.</p>'}</div></div>`;
}
function mine(){
  const w=sumW(),p=sumP(),fpT=D.entries.filter(e=>e.fp).length,fpP=D.payouts.reduce((a,x)=>a+(x.fp||0),0),off=(w-p)*D.rate+(fpT-fpP)*D.fpRate,t=new Date().toISOString().slice(0,10);
  const L=D.entries.filter(e=>e.d.startsWith(month)).sort((a,b)=>b.d.localeCompare(a.d));
  const mw=L.reduce((a,e)=>a+work(e),0);
  const rows=L.map(e=>`<tr><td>${fd(e.d)}</td><td>${wd(e.d)}</td><td>${esc(e.ort)}</td><td>${esc(e.tat)}</td><td>${e.b}–${e.e}</td><td>${e.p}</td><td>${e.fp?'✓':''}</td><td><b>${fh(work(e))}</b></td><td>${fe(pay(e))}</td><td class="x"><button class="bad" data-de="${e.id}"${pend==='e'+e.id?' style="background:var(--bad);color:#fff;font-size:.9rem"':''}>${pend==='e'+e.id?'Löschen?':'✕'}</button></td></tr>`).join('');
  const pr=D.payouts.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<tr><td>${fd(x.d)}</td><td>${fh(x.h)}</td><td>${x.fp||0}</td><td>${esc(x.n)}</td><td class="x"><button class="bad" data-dp="${x.id}"${pend==='p'+x.id?' style="background:var(--bad);color:#fff;font-size:.9rem"':''}>${pend==='p'+x.id?'Löschen?':'✕'}</button></td></tr>`).join('');
  return `<div class="card"><label>Name des Mitarbeiters<input id="nm" value="${esc(D.name)}" placeholder="Vor- und Nachname" autocomplete="name" style="width:260px"></label></div>
  <div class="card"><div class="sum"><div><div class="mu">Gearbeitet gesamt</div><div class="big">${fh(w)}</div></div><div><div class="mu">Ausbezahlt</div><div class="big">${fh(p)}</div></div><div><div class="mu">Verbleibend</div><div class="big">${fh(w-p)}</div></div><div><div class="mu">Verdienst gesamt</div><div class="big">${fe(sumPay())}</div></div><div><div class="mu">Offener Betrag</div><div class="big">${fe(off)}</div><div class="mu">inkl. ${fpT-fpP} Fahrpauschale(n)</div></div></div></div>
  <div class="card"><b>Neuer Eintrag</b><div class="row" style="margin-top:8px">
    <label>Datum<input id="d" type="date" value="${t}"></label><label>Ort<input id="o" style="width:130px"></label><label>Tätigkeit<input id="t" style="width:150px"></label>
    <label>Beginn<input id="b" type="time" value="08:00"></label><label>Ende<input id="e" type="time" value="16:00"></label>
    <label>Pause (min)<input id="p" type="number" min="0" value="30" style="width:90px"></label><button type="button" id="fp" class="${fpOn?'':'sec'}">${fpOn?'✓ ':''}Fahrpauschale</button><button id="add">Speichern</button></div>
    <div class="err">${esc(msg)}</div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><label>Monat<input id="mon" type="month" value="${month}"></label><div><div class="big">${fh(mw)}</div><div class="mu">${L.filter(e=>e.fp).length} Fahrpauschale(n) · ${fe(L.reduce((a,e)=>a+pay(e),0))}</div></div></div>
    <div class="scroll">${L.length?`<table><tr><th>Datum</th><th>Tag</th><th>Ort</th><th>Tätigkeit</th><th>Zeit</th><th>Pause</th><th>Fahrpausch.</th><th>Arbeitszeit</th><th>Verdienst</th><th class="x"></th></tr>${rows}</table>`:'<p class="mu">Keine Einträge in diesem Monat.</p>'}</div></div>
  <div class="card"><b>Auszahlungen (Stunden und Fahrpauschalen)</b><div class="row" style="margin:8px 0"><label>Datum<input id="pd" type="date" value="${t}"></label><label>Stunden<input id="ph" type="number" step="0.25" min="0" style="width:90px"></label><label>Fahrpauschalen (Anzahl)<input id="pf" type="number" step="1" min="0" value="0" style="width:90px"></label><label>Notiz<input id="pn" style="width:150px"></label><button id="addp">Abziehen</button></div>
    ${pr?`<div class="scroll"><table><tr><th>Datum</th><th>Stunden</th><th>Fahrpausch.</th><th>Notiz</th><th class="x"></th></tr>${pr}</table></div>`:''}</div>
  <div class="card"><div class="row">
    <label>Stundenlohn (€)<input id="rt" type="number" step="0.5" min="0" value="${D.rate}" style="width:90px"></label><label>Fahrpauschale (€)<input id="fr" type="number" step="0.5" min="0" value="${D.fpRate}" style="width:90px"></label><button class="sec" id="csv">CSV-Export</button></div></div>`;
}
function render(){
  $('#t1').className=tab==1?'':'sec';$('#t2').className=tab==2?'':'sec';
  $('#app').innerHTML=tab==1?mine():chef();
}
document.addEventListener('click',e=>{const t=e.target.closest('button,tr.cl');if(!t){if(pend){pend=null;render();}return;}
  if(t.id=='t1'){tab=1;render();}else if(t.id=='t2'){tab=2;render();}
  else if(t.id=='add')addEntry();else if(t.id=='addp')addPayout();else if(t.id=='csv')exportCsv();
  else if(t.id=='fp'){fpOn=!fpOn;t.className=fpOn?'':'sec';t.textContent=(fpOn?'✓ ':'')+'Fahrpauschale';}
  else if(t.id=='clr'){imp=[];open=null;render();}
  else if(t.dataset.de){if(pend==='e'+t.dataset.de){D.entries=D.entries.filter(x=>x.id!==t.dataset.de);pend=null;persist();}else pend='e'+t.dataset.de;render();}
  else if(t.dataset.dp){if(pend==='p'+t.dataset.dp){D.payouts=D.payouts.filter(x=>x.id!==t.dataset.dp);pend=null;persist();}else pend='p'+t.dataset.dp;render();}
  else if(t.dataset.o){open=open===t.dataset.o?null:t.dataset.o;render();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id=='mon'&&t.value){month=t.value;render();}
  else if(t.id=='rt'||t.id=='fr'){const v=parseFloat(String(t.value).replace(',','.'));if(v>=0){D[t.id=='rt'?'rate':'fpRate']=v;persist();}render();}
  else if(t.id=='nm'){D.name=t.value.trim();persist();}
  else if(t.id=='imp'&&t.files.length)importFiles([...t.files]);});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
